name: Quick test build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick-test:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Compile sources
        run: python -m compileall -q todo ToDo.pyw
      - name: Build portable app
        shell: cmd
        run: pyinstaller --noconfirm --clean --windowed --onedir --name ToDo --paths todo --add-data "todo;todo" ToDo.pyw
      - name: Create quick test ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/ToDo/* -DestinationPath dist/ToDo-QuickTest-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ToDo-QuickTest-Windows
          path: dist/ToDo-QuickTest-Windows.zip
          if-no-files-found: error
          compression-level: 0
