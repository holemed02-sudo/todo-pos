name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack baseline source
        shell: pwsh
        run: |
          Expand-Archive -Path baseline/ToDo_POS_1_0_2-source.zip -DestinationPath src -Force
      - name: Apply current source overrides
        shell: pwsh
        run: |
          Copy-Item -Path overrides\* -Destination src -Recurse -Force
      - name: Install dependencies
        working-directory: src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Run core tests
        working-directory: src
        run: python tests/test_core.py
      - name: Compile Python sources
        working-directory: src
        run: python -m compileall -q todo
      - name: Build portable Windows app
        working-directory: src
        shell: cmd
        run: pyinstaller --noconfirm --clean --windowed --onedir --name ToDo --paths todo --add-data "todo;todo" ToDo.pyw
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: ToDo-POS-Windows
          path: src/dist/ToDo
          if-no-files-found: error
