name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and unpack baseline source
        shell: pwsh
        run: |
          $parts = Get-ChildItem baseline/chunks/part*.b64 | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 baseline chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('baseline.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path baseline.zip -DestinationPath src -Force

      - name: Apply current source overrides
        shell: pwsh
        run: |
          Copy-Item -Path overrides\* -Destination src -Recurse -Force

      - name: Install dependencies
        working-directory: src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run core tests
        working-directory: src
        run: python tests/test_core.py

      - name: Compile Python sources
        working-directory: src
        run: python -m compileall -q todo

      - name: Build portable Windows app
        working-directory: src
        shell: cmd
        run: pyinstaller --noconfirm --clean --windowed --onedir --name ToDo --paths todo --add-data "todo;todo" ToDo.pyw

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: ToDo-POS-Windows
          path: src/dist/ToDo
          if-no-files-found: error
